name: Refresh profile activity

on:
  schedule:
    - cron: '17,47 * * * *' # Every 30 minutes; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions.yml'
      - 'scripts/update_activity.py'
      - 'scripts/motion_lab.py'

permissions:
  contents: read

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'taku0193/taku0193'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Update contribution pulse and activity summary
        run: python3 scripts/update_activity.py --out assets --username taku0193
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Motion Lab and Beat Runner
        run: python3 scripts/motion_lab.py --assets assets

      - name: Save updated activity images
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/header-light.svg
          test -s assets/header-dark.svg
          test -s assets/beat-runner-light.svg
          test -s assets/beat-runner-dark.svg
          test -s assets/pulse-light.svg
          test -s assets/pulse-dark.svg
          test -s assets/overview-light.svg
          test -s assets/overview-dark.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/header-light.svg assets/header-dark.svg assets/beat-runner-light.svg assets/beat-runner-dark.svg assets/pulse-light.svg assets/pulse-dark.svg assets/overview-light.svg assets/overview-dark.svg assets/activity-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile activity"
          git pull --rebase origin main
          git push origin HEAD:main
